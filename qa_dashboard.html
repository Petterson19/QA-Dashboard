<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Dashboard - Fluxo de Acúmulo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin: auto;
        }
        h2, h3 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: #3498db;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input, select, textarea {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .checkbox-group {
            background: #fff5f5;
            padding: 15px;
            border-left: 4px solid #e74c3c;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .checkbox-item input {
            margin-right: 10px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-danger { background-color: #e74c3c; width: auto; padding: 5px 10px; font-size: 12px;}
        .btn-danger:hover { background-color: #c0392b; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 10px;
            text-align: left;
        }
        th { background-color: #f8fafc; }
        
        .score-box {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistema de Gestão e Fluxo de QA</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('cadastro')">1. Registrar Nova Tarefa</button>
        <button class="tab-btn" onclick="switchTab('relatorios')">2. Relatórios por Anotador</button>
        <button class="tab-btn" onclick="switchTab('historico')">3. Histórico do Banco (${getTaskCount()})</button>
    </div>

    <div id="cadastro" class="tab-content active">
        <h3>Registrar Avaliação Individual</h3>
        <div class="grid-2">
            <div>
                <div class="form-group">
                    <label>* Nome do QA</label>
                    <input type="text" id="qaName" value="Petterson Cavalheiro">
                </div>
                <div class="form-group">
                    <label>* Data da Avaliação</label>
                    <input type="date" id="qaDate">
                </div>
                <div class="form-group">
                    <label>* Nome do Anotador (Labeller)</label>
                    <input type="text" id="labeller" placeholder="Ex: João Silva" required>
                </div>
            </div>
            <div>
                <div class="form-group">
                    <label>* Task ID</label>
                    <input type="text" id="taskId" placeholder="Ex: TSK-99281">
                </div>
                <div class="form-group">
                    <label>Total de Itens/Segmentos Analisados nesta Task</label>
                    <input type="number" id="totalItems" value="10" min="1">
                </div>
                <div class="form-group">
                    <label>Quantidade de Itens com Erro nesta Task</label>
                    <input type="number" id="errorItems" value="0" min="0">
                </div>
            </div>
        </div>

        <h3>Infrações Identificadas nesta Tarefa</h3>
        <div class="checkbox-group">
            <div class="checkbox-item">
                <input type="checkbox" class="error-check" value="Pontuação (Fluxo vs Finalidade)">
                <label>Pontuação: Falha na regra de fluxo (vírgulas) ou finalidade (pontos).</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" class="error-check" value="Formatação de Diálogos">
                <label>Diálogo: Tags narrativas inseridas incorretamente dentro das aspas.</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" class="error-check" value="Capitalização (Principal Word Rule)">
                <label>Capitalização: Erro ao capitalizar palavras secundárias ou falha em títulos.</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" class="error-check" value="Interjeições e Rótulos">
                <label>Interjeições: Uso de marcações inválidas como [laughs] ou formas não lexicalizadas.</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" class="error-check" value="Acrônimos e Inicialismos">
                <label>Siglas: Erro de espaçamento em letras faladas individualmente vs faladas como palavra.</label>
            </div>
        </div>

        <button class="btn btn-success" onclick="saveTask()">Salvar Tarefa no Banco de Dados</button>
    </div>

    <div id="relatorios" class="tab-content">
        <h3>Gerar Relatório Consolidado por Anotador</h3>
        <div class="form-group" style="flex-direction: row; gap: 10px; align-items: flex-end;">
            <div style="flex: 1;">
                <label>Selecione o Anotador no Banco:</label>
                <select id="selectLabeller" onchange="generateReport()"></select>
            </div>
        </div>

        <div id="reportResult" style="display:none; margin-top: 20px;">
            <div class="grid-2">
                <div>
                    <div class="score-box" id="accuracyBox">0.00%</div>
                </div>
                <div>
                    <div class="form-group">
                        <label>Métrica de Categoria Selecionada (QA Score)</label>
                        <input type="text" id="scoreCategoryField" readonly style="font-weight: bold; background: #f8fafc;">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Resumo de Métricas Acumuladas:</label>
                <p id="metricsSummaryText" style="font-size: 14px; background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;"></p>
            </div>

            <div class="form-group">
                <label>Feedback Consolidado Pronto para Cópia (Comments):</label>
                <textarea id="consolidatedComments" rows="12"></textarea>
            </div>
        </div>
    </div>

    <div id="historico" class="tab-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Todas as Tarefas Registradas</h3>
            <button class="btn btn-danger" onclick="clearDatabase()">Limpar Todo o Banco de Dados</button>
        </div>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Data QA</th>
                    <th>Anotador</th>
                    <th>Task ID</th>
                    <th>Itens Totais</th>
                    <th>Erros</th>
                    <th>Precisão</th>
                    <th>Erros Cometidos</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    document.getElementById('qaDate').valueAsDate = new Date();

    // Alternar entre abas
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');

        if(tabId === 'relatorios') populateLabellerDropdown();
        if(tabId === 'historico') renderHistoryTable();
        updateTabLabels();
    }

    function updateTabLabels() {
        document.querySelectorAll('.tabs button')[2].innerText = `3. Histórico do Banco (${getTaskCount()})`;
    }

    function getTaskCount() {
        const data = localStorage.getItem('qa_tasks_db');
        return data ? JSON.parse(data).length : 0;
    }

    // Salvar tarefa no LocalStorage
    function saveTask() {
        const labeller = document.getElementById('labeller').value.trim();
        const taskId = document.getElementById('taskId').value.trim();
        const totalItems = parseInt(document.getElementById('totalItems').value);
        const errorItems = parseInt(document.getElementById('errorItems').value);
        const qaDate = document.getElementById('qaDate').value;
        const qaName = document.getElementById('qaName').value;

        if (!labeller || !taskId || isNaN(totalItems) || isNaN(errorItems)) {
            alert("Por favor, preencha todos os campos obrigatórios (*).");
            return;
        }
        if (errorItems > totalItems) {
            alert("O número de erros não pode ser maior que o total de itens.");
            return;
        }

        // Capturar erros selecionados
        let errorsCommitted = [];
        document.querySelectorAll('.error-check:checked').forEach(cb => {
            errorsCommitted.push(cb.value);
        });

        const newTask = {
            qaName, qaDate, labeller, taskId, totalItems, errorItems, errorsCommitted
        };

        let db = localStorage.getItem('qa_tasks_db') ? JSON.parse(localStorage.getItem('qa_tasks_db')) : [];
        db.push(newTask);
        localStorage.setItem('qa_tasks_db', JSON.stringify(db));

        alert(`Tarefa ${taskId} do anotador ${labeller} salva com sucesso!`);
        
        // Resetar campos dinâmicos para a próxima inserção
        document.getElementById('taskId').value = '';
        document.getElementById('errorItems').value = '0';
        document.querySelectorAll('.error-check').forEach(cb => cb.checked = false);
        updateTabLabels();
    }

    // Preencher o menu suspenso de anotadores únicos
    function populateLabellerDropdown() {
        const select = document.getElementById('selectLabeller');
        select.innerHTML = '<option value="">-- Selecione um Anotador --</option>';
        
        let db = localStorage.getItem('qa_tasks_db') ? JSON.parse(localStorage.getItem('qa_tasks_db')) : [];
        if(db.length === 0) return;

        // Extrai nomes únicos dos anotadores
        let labellers = [...new Set(db.map(task => task.labeller))];
        
        labellers.forEach(name => {
            let opt = document.createElement('option');
            opt.value = name;
            opt.innerText = name;
            select.appendChild(opt);
        });
    }

    // Gerar Relatório Agregado do Anotador Selecionado
    function generateReport() {
        const targetLabeller = document.getElementById('selectLabeller').value;
        if (!targetLabeller) {
            document.getElementById('reportResult').style.display = 'none';
            return;
        }

        let db = localStorage.getItem('qa_tasks_db') ? JSON.parse(localStorage.getItem('qa_tasks_db')) : [];
        let filteredTasks = db.filter(task => task.labeller === targetLabeller);

        let totalAccumulated = 0;
        let errorsAccumulated = 0;
        let allErrorsMap = {};

        filteredTasks.forEach(task => {
            totalAccumulated += task.totalItems;
            errorsAccumulated += task.errorItems;
            task.errorsCommitted.forEach(err => {
                allErrorsMap[err] = (allErrorsMap[err] || 0) + 1;
            });
        });

        // Cálculos de precisão acumulada
        const accuracy = totalAccumulated > 0 ? ((totalAccumulated - errorsAccumulated) / totalAccumulated) * 100 : 0;
        
        // Categoria baseada no print enviado
        let scoreCategory = "";
        let color = "";
        if (accuracy > 90) { scoreCategory = "> 90%"; color = "#2ecc71"; }
        else if (accuracy >= 80) { scoreCategory = "80%-90%"; color = "#f39c12"; }
        else if (accuracy >= 70) { scoreCategory = "70%-80%"; color = "#3498db"; }
        else if (accuracy >= 60) { scoreCategory = "60%-70%"; color = "#f1c40f"; }
        else { scoreCategory = "< 60%"; color = "#e74c3c"; }

        // Atualizar interface gráfica
        const accBox = document.getElementById('accuracyBox');
        accBox.innerText = `Precisão Geral: ${accuracy.toFixed(2)}%`;
        accBox.style.color = 'white';
        accBox.style.backgroundColor = color;

        document.getElementById('scoreCategoryField').value = scoreCategory;
        document.getElementById('metricsSummaryText').innerText = `Total de Tarefas Avaliadas: ${filteredTasks.length} | Segmentos Analisados: ${totalAccumulated} | Total de Erros Mapeados: ${errorsAccumulated}`;

        // Construção do Texto de Feedback Inteligente
        let comments = `Prezado(a) ${targetLabeller},\n\n`;
        comments += `Realizamos a consolidação das suas últimas ${filteredTasks.length} tarefas sob os critérios das nossas Diretrizes. Sua acurácia acumulada foi de ${accuracy.toFixed(2)}% (Métrica de Score: ${scoreCategory}).\n\n`;

        if (errorsAccumulated === 0) {
            comments += `Parabéns! Sua performance foi impecável ao longo destas entregas, demonstrando total aderência e atenção às diretrizes e tratamento de áudio. Continue mantendo esse alto padrão de qualidade!`;
        } else {
            comments += `Identificamos que os desvios cometidos se concentraram com maior frequência nas seguintes diretrizes do documento 'PT-BR Special Notes':\n`;
            
            // Listar mapeamento de erros baseado em incidência
            for (let errType in allErrorsMap) {
                let contextRule = "";
                if (errType.includes("Pontuação")) {
                    contextRule = "Regra de Fluxo (vírgula para pensamentos contínuos) e Regra de Finalidade (ponto final para pensamentos concluídos).";
                } else if (errType.includes("Diálogos")) {
                    contextRule = "Regra de Tags: as descrições narrativas (ex: disse Fulano) devem, sem exceção, permanecer fora das aspas.";
                } else if (errType.includes("Capitalização")) {
                    contextRule = "Principal Word Rule: certifique-se de capitalizar substantivos, verbos e adjetivos em títulos, deixando artigos e preposições em minúsculo.";
                } else if (errType.includes("Interjeições")) {
                    contextRule = "Apenas formas estritamente lexicalizadas de risos/interjeições são permitidas. Rótulos como [laughs] ou [coughs] não devem ser criados.";
                } else if (errType.includes("Acrônimos")) {
                    contextRule = "Lembre-se: siglas faladas como uma palavra ficam juntas (ex: NASA), enquanto siglas soletradas letra a letra exigem um espaço de separação (ex: B B C).";
                }
                comments += `- ${errType} (Detectado em ${allErrorsMap[errType]} tarefa(s)): ${contextRule}\n`;
            }
            comments += `\nSolicitamos que faça uma revisão atenta destes tópicos no guia do projeto antes de prosseguir com os próximos lotes de tarefas. Estamos à disposição caso haja alguma dúvida sobre a aplicação prática das regras.`;
        }

        document.getElementById('consolidatedComments').value = comments;
        document.getElementById('reportResult').style.display = 'block';
    }

    // Renderizar Tabela do Histórico
    function renderHistoryTable() {
        const tbody = document.querySelector('#historyTable tbody');
        tbody.innerHTML = '';
        
        let db = localStorage.getItem('qa_tasks_db') ? JSON.parse(localStorage.getItem('qa_tasks_db')) : [];
        if(db.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Nenhuma tarefa gravada no banco de dados local ainda.</td></tr>';
            return;
        }

        db.reverse().forEach(task => {
            let tr = document.createElement('tr');
            let accuracy = task.totalItems > 0 ? ((task.totalItems - task.errorItems) / task.totalItems) * 100 : 0;
            
            tr.innerHTML = `
                <td>${task.qaDate}</td>
                <td><strong>${task.labeller}</strong></td>
                <td>${task.taskId}</td>
                <td>${task.totalItems}</td>
                <td>${task.errorItems}</td>
                <td style="font-weight:bold; color: ${accuracy >= 90 ? 'green' : 'orange'}">${accuracy.toFixed(1)}%</td>
                <td>${task.errorsCommitted.join(', ') || 'Nenhum'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Limpar Banco de Dados
    function clearDatabase() {
        if(confirm("Tem certeza absoluta de que deseja apagar TODAS as tarefas gravadas no banco de dados local? Esta ação não pode ser desfeita.")) {
            localStorage.removeItem('qa_tasks_db');
            renderHistoryTable();
            updateTabLabels();
            document.getElementById('reportResult').style.display = 'none';
            alert("Banco de dados resetado.");
        }
    }
</script>

</body>
</html>
